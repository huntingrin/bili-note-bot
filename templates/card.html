<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 1080px; height: 1440px;
    background: #0f1216; color: #f5f7fa;
    font-family: "PingFang SC", "Hiragino Sans GB", "Noto Sans CJK SC", "Source Han Sans SC",
                 "Microsoft YaHei", -apple-system, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .card {
    width: 1080px; height: 1440px;
    padding: 48px;
    display: flex; flex-direction: column;
    overflow: hidden;
  }

  /* ---------- 1. 截图 ---------- */
  h1 {
    font-size: 40px; line-height: 1.26; font-weight: 700;
    letter-spacing: -0.4px;
    max-height: 101px; overflow: hidden;
  }
  .meta {
    margin-top: 8px; font-size: 21px; color: #8e99a8;
    display: flex; gap: 10px; align-items: center;
  }
  .meta .dot { color: #4b5666; }

  .grid {
    margin-top: 16px;
    display: grid;
    grid-template-columns: repeat(var(--cols, 3), 1fr);
    grid-auto-rows: var(--row-h, 166px);
    gap: 12px;
  }
  .frame {
    position: relative; border-radius: 8px; overflow: hidden;
    background: #1a1f26;
  }
  .frame img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .ts {
    position: absolute; left: 6px; bottom: 6px;
    background: rgba(0, 0, 0, 0.78); color: #fff;
    font-size: 15px; line-height: 1;
    padding: 5px 7px; border-radius: 4px;
    font-variant-numeric: tabular-nums;
  }

  /* ---------- 2. 总结 ---------- */
  .chapters {
    margin-top: 20px; flex: 1 1 auto;
    display: flex; flex-direction: column; gap: 14px;
    overflow: hidden;
  }
  /* few chapters: keep the block right under the grid (whitespace stays at the
     bottom, never between stills and text) */
  .chapters.sparse { margin-top: 28px; }
  .chapter { padding-left: 16px; border-left: 3px solid #3f6fe0; }
  .chapter-head {
    display: flex; align-items: baseline; gap: 8px;
    font-size: 24px; font-weight: 600; line-height: 1.3;
  }
  .chapter-ts {
    font-size: 18px; font-weight: 400; color: #7c8b9e;
    font-variant-numeric: tabular-nums;
  }
  ul { margin: 4px 0 0; padding-left: 20px; }
  li { font-size: 19px; line-height: 1.42; color: #c9d2de; }
  li::marker { color: #4a6fa8; }

  /* denser wording (5 chapters × 3 points) — shrink frames and type */
  .dense .chapters { gap: 8px; margin-top: 16px; }
  .dense .chapter-head { font-size: 22px; }
  .dense li { font-size: 17.5px; line-height: 1.3; }
  .dense h1 { font-size: 36px; max-height: 91px; }
</style>
</head>
<body>
<div class="card{% if dense %} dense{% endif %}{% if sparse %} sparse{% endif %}" style="--cols: {{ grid_cols }}; --row-h: {{ grid_row_h }}px;">

  <h1>{{ summary.title }}</h1>
  <div class="meta">
    <span>{{ summary.up_name }}</span>
    <span class="dot">·</span>
    <span>{{ duration_label }}</span>
  </div>

  <div class="grid">
    {% for frame in frames %}
    <div class="frame">
      <img src="{{ frame.data_uri }}" alt="">
      <span class="ts">{{ frame.label }}</span>
    </div>
    {% endfor %}
  </div>

  <div class="chapters{% if sparse %} sparse{% endif %}">
    {% for chapter in summary.chapters %}
    <div class="chapter">
      <div class="chapter-head">
        <span>{{ chapter.heading }}</span>
        <span class="chapter-ts">{{ chapter.timestamp_label }}</span>
      </div>
      <ul>
        {% for point in chapter.points %}
        <li>{{ point }}</li>
        {% endfor %}
      </ul>
    </div>
    {% endfor %}
  </div>

</div><!-- /.card -->
</body>
</html>
